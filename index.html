<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Site</title>
  <meta name="description" content="Site inicial criado com Claude Code.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#top">Meu Site</a>
    <nav>
      <a href="#sobre">Sobre</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1>Olá, bem-vindo!</h1>
      <p>Este é o ponto de partida do seu site. Vamos construí-lo juntos.</p>
      <a class="button" href="#contato">Fale comigo</a>
    </section>

    <section id="sobre" class="content">
      <h2>Sobre</h2>
      <p>Descreva aqui quem você é e o que o site oferece.</p>
    </section>

    <section id="contato" class="content">
      <h2>Contato</h2>
      <p>Adicione seus dados de contato ou um formulário.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="ano"></span> Meu Site</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
